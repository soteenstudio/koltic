name: GuardPR Auto-Fix
on:
  push: { branches: [main, master] }
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 3062-in-zamud/guardpr@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
